<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HELLO / GOODBYE</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; cursor: pointer; }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* Shown only if WebGL2 is unavailable: a plain crossfade on the same 6s loop. */
  .fallback { position: fixed; inset: 0; display: none; }
  .fallback span {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font: 700 clamp(48px, 12vw, 200px) Helvetica, Arial, sans-serif; letter-spacing: 0.05em;
    animation: swap 3s ease-in-out infinite;
  }
  .fallback span + span { animation-delay: -1.5s; }
  @keyframes swap { 0%, 8% { opacity: 1; } 50%, 58% { opacity: 0; } 100% { opacity: 1; } }
  .hint {
    position: fixed; left: 0; right: 0; bottom: 28px; text-align: center; pointer-events: none;
    color: #9aa844; font: 600 12px Helvetica, Arial, sans-serif; letter-spacing: 0.3em; text-transform: uppercase;
    transition: opacity 0.4s;
  }
  .hint.off { opacity: 0; }
  .no-gl .hint { display: none; }
  .no-gl canvas { display: none; }
  .no-gl .fallback { display: block; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="HELLO growing into GOODBYE and back"></canvas>
<div class="hint off" id="hint">click for sound</div>
<div class="fallback" aria-hidden="true"><span>HELLO</span><span>GOODBYE</span></div>
<script>
(() => {
  const WORDS = ['HELLO', 'GOODBYE'];
  const CYCLE = 3;             // seconds: HELLO -> GOODBYE -> HELLO (two bars of the break)
  const REST = 0.28;           // how much it keeps flowing even when a word is fully formed (0 = freezes)
  const ZOOM_CYCLES = 8;       // word cycles it takes to grow from normal size to its largest
  const OVERLAP = 1.5;         // seconds the outgoing giant word and the incoming small one share
  const STORM_CYCLES = 2;      // lightning behind the letters during this many final cycles
  const TOTAL = CYCLE * ZOOM_CYCLES;

  // The break: 160 BPM, sixteen steps to a bar, four bars (A A B C) looping.
  // x = hit, X = accented snare, o = ghost snare.
  const STEP = CYCLE / 32;
  const BARS = [
    { k: 'x.x.......xx....', s: '....X..o.o..X..o' },
    { k: 'x.x.......xx....', s: '....X..o.o..X..o' },
    { k: 'x.x.......x.....', s: '....X..o.o....X.' },
    { k: '..xx......x.....', s: '.o..X..o.o....X.', crash: 10 },
  ];
  const barOf = (n) => BARS[Math.floor(n / 16) % BARS.length];

  // Distance-field texture: both words drawn once, at a fixed size, independent of the screen.
  const TW = 3072, TH = 960;

  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
  if (!gl) { document.documentElement.classList.add('no-gl'); return; }
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- signed distance fields (exact Euclidean distance transform) ----
  const INF = 1e20;
  function edt1d(f, d, v, z, n) {
    v[0] = 0; z[0] = -INF; z[1] = INF;
    for (let q = 1, k = 0; q < n; q++) {
      let s;
      do {
        const r = v[k];
        s = (f[q] - f[r] + q * q - r * r) / (q - r) / 2;
      } while (s <= z[k] && --k > -1);
      k++; v[k] = q; z[k] = s; z[k + 1] = INF;
    }
    for (let q = 0, k = 0; q < n; q++) {
      while (z[k + 1] < q) k++;
      const r = v[k];
      d[q] = f[r] + (q - r) * (q - r);
    }
  }
  function edt(grid, w, h) {
    const n = Math.max(w, h);
    const f = new Float64Array(n), d = new Float64Array(n);
    const v = new Uint16Array(n), z = new Float64Array(n + 1);
    for (let x = 0; x < w; x++) {
      for (let y = 0; y < h; y++) f[y] = grid[y * w + x];
      edt1d(f, d, v, z, h);
      for (let y = 0; y < h; y++) grid[y * w + x] = d[y];
    }
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) f[x] = grid[y * w + x];
      edt1d(f, d, v, z, w);
      for (let x = 0; x < w; x++) grid[y * w + x] = Math.sqrt(d[x]);
    }
  }

  const scratch = document.createElement('canvas');
  scratch.width = TW; scratch.height = TH;
  const sx = scratch.getContext('2d', { willReadFrequently: true });
  const fontOf = (px) => `700 ${px}px Helvetica, Arial, sans-serif`;
  const spaced = (px) => { if ('letterSpacing' in sx) sx.letterSpacing = `${px * 0.05}px`; };

  // Pick the texture font size so the longer word fills ~70% of the texture width.
  sx.font = fontOf(100); spaced(100);
  const EM = Math.floor(100 * (TW * 0.7) / Math.max(...WORDS.map((w) => sx.measureText(w).width)));

  const field = new Float32Array(TW * TH * 2);   // R = HELLO, G = GOODBYE, in em units
  WORDS.forEach((word, ch) => {
    sx.clearRect(0, 0, TW, TH);
    sx.font = fontOf(EM); spaced(EM);
    sx.textAlign = 'center'; sx.textBaseline = 'middle'; sx.fillStyle = '#fff';
    sx.fillText(word, TW / 2, TH / 2);
    const px = sx.getImageData(0, 0, TW, TH).data;
    const outer = new Float64Array(TW * TH), inner = new Float64Array(TW * TH);
    for (let i = 0; i < TW * TH; i++) {
      const a = px[i * 4 + 3] / 255;
      outer[i] = a === 1 ? 0 : a === 0 ? INF : Math.max(0, 0.5 - a) ** 2;
      inner[i] = a === 1 ? INF : a === 0 ? 0 : Math.max(0, a - 0.5) ** 2;
    }
    edt(outer, TW, TH); edt(inner, TW, TH);
    for (let i = 0; i < TW * TH; i++) field[i * 2 + ch] = (outer[i] - inner[i]) / EM;
  });

  // ---- GL ----
  const VERT = `#version 300 es
  in vec2 a; void main() { gl_Position = vec4(a, 0.0, 1.0); }`;

  const FRAG = `#version 300 es
  precision highp float;
  uniform sampler2D uField;
  uniform vec2 uRes, uTex;   // canvas size (px); texture size / em size
  uniform vec2 uFs, uW;       // font size (px) and weight of the two overlapping zoom layers
  uniform float uT, uE, uG, uCalm, uFlash, uSeed;
  out vec4 o;

  float hash(vec2 p) {
    vec3 q = fract(vec3(p.xyx) * 0.1031);
    q += dot(q, q.yzx + 33.33);
    return fract((q.x + q.y) * q.z);
  }
  float noise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
    return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x),
               mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
  }
  // Two soft octaves only: liquid, no crinkle.
  float soft(vec2 p) { return (noise(p) + 0.45 * noise(p * 1.9 + 31.7)) / 1.45; }
  vec2 flow(vec2 p, float t) {
    return vec2(soft(p + vec2(0.0, t)), soft(p + vec2(5.2, -t) + 1.7)) - 0.5;
  }
  // Colours lifted from the reference image: indigo, plum, brick, rust, olive-yellow, moss, teal.
  const vec3 PAL[7] = vec3[7](
    vec3(0.20, 0.125, 0.42), vec3(0.42, 0.12, 0.33), vec3(0.59, 0.19, 0.165), vec3(0.72, 0.36, 0.19),
    vec3(0.60, 0.66, 0.27), vec3(0.185, 0.36, 0.23), vec3(0.14, 0.28, 0.30));
  vec3 palette(float h) {
    h = fract(h) * 7.0;
    int i = int(floor(h));
    return mix(PAL[i], PAL[(i + 1) % 7], smoothstep(0.0, 1.0, fract(h)));
  }

  // One lightning bolt: a thin jagged line across the screen at a random angle, plus a faint halo.
  float bolt(vec2 sp, float seed) {
    float a = hash(vec2(seed, 1.3)) * 3.1416;
    vec2 r = vec2(cos(a) * sp.x + sin(a) * sp.y, cos(a) * sp.y - sin(a) * sp.x);
    float path = (hash(vec2(seed, 7.7)) - 0.5) * 0.9
               + (noise(vec2(r.y * 3.0, seed)) - 0.5) * 0.30
               + (noise(vec2(r.y * 13.0, seed + 9.0)) - 0.5) * 0.05;
    float dd = abs(r.x - path);
    return 0.0034 / (dd + 0.0034) + 0.05 * exp(-dd * 12.0);
  }

  vec4 shade(float fs) {
    vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / fs;    // em units, origin at centre
    p.y = -p.y;

    // The surface breathes and flows: a swirl folded into itself, strongest mid-change.
    float amp = (0.006 + 0.20 * uG) * (1.0 - uCalm);
    vec2 w1 = flow(p * 0.9, uT * 0.14);
    vec2 w2 = flow(p * 1.6 + w1 * 2.5, uT * 0.19);
    vec2 q = p * (1.0 - 0.03 * uG * sin(uT * 1.3) * (1.0 - uCalm)) + (w1 + w2 * 0.6) * amp;

    vec2 uv = 0.5 + q / uTex;
    vec2 d2 = texture(uField, uv).rg;

    // Each region ripens at its own moment, so one word grows out of the other in patches.
    float n = soft(p * 1.1 + w1 * 1.5 + uT * 0.05);
    float k = 0.55 * (1.0 - uCalm);
    float m = smoothstep(n * k, n * k + 1.0, uE * (1.0 + k));

    float d = mix(d2.x, d2.y, m);
    d -= uG * 0.05;                                              // keep its body while in between
    d += uG * 0.10 * (soft(q * 2.2 + uT * 0.3) - 0.5) * (1.0 - uCalm);   // buds and hollows

    float aa = max(fwidth(d), 1e-4);
    float body = smoothstep(aa, -aa, d);

    // Aura: soft rings in the palette's colours drifting off the shape, brightest mid-change.
    vec2 e = smoothstep(vec2(0.0), vec2(0.08), uv) * smoothstep(vec2(0.0), vec2(0.08), 1.0 - uv);
    float ring = 0.5 + 0.5 * sin(d * 20.0 - uT * 3.0 + n * 5.0);
    float glow = exp(-max(d, 0.0) * 3.6) * uG * e.x * e.y * (1.0 - uCalm);
    vec3 aura = palette(d * 0.9 - uT * 0.13 + n * 0.7) * ring * glow * 1.3;

    return vec4(mix(aura, vec3(1.0), body), body);
  }

  void main() {
    vec4 c = shade(uFs.x) * uW.x;
    if (uW.y > 0.0) c += shade(uFs.y) * uW.y;   // the next run, already emerging in the distance

    // Lightning behind the letters: bolts and a dull glow in the cloud, hidden where a letter covers them.
    vec3 bg = vec3(0.0);
    if (uFlash > 0.0) {
      vec2 sp = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
      float b = bolt(sp, uSeed) + 0.7 * bolt(sp, uSeed + 3.1) + 0.45 * bolt(sp, uSeed + 6.2);
      float cloud = soft(sp * 1.6 + uSeed);
      bg = (vec3(0.80, 0.86, 0.36) * min(b, 1.4) + vec3(0.62, 0.20, 0.13) * cloud * cloud * 1.2
            + vec3(0.42, 0.12, 0.33) * 0.12) * uFlash;
    }
    o = vec4(c.rgb + bg * (1.0 - clamp(c.a, 0.0, 1.0)), 1.0);
  }`;

  function shader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG16F, TW, TH, 0, gl.RG, gl.FLOAT, field);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  const U = (name) => gl.getUniformLocation(prog, name);
  const uRes = U('uRes'), uTex = U('uTex'), uFs = U('uFs'), uT = U('uT'), uE = U('uE'), uG = U('uG'), uW = U('uW');
  const uFlash = U('uFlash'), uSeed = U('uSeed');
  gl.uniform1i(U('uField'), 0);
  gl.uniform1f(U('uCalm'), calm ? 1 : 0);
  gl.uniform2f(uTex, TW / EM, TH / EM);

  let fsStart = 0, fsEnd = 0;   // font size in device px: where the zoom begins and where it ends
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    fsStart = Math.max(48, Math.min(innerWidth * 0.12, 200)) * dpr;
    // Largest: letters about half the screen tall, the word spilling past both sides.
    fsEnd = Math.max(fsStart * 2.2, 0.7 * Math.min(innerHeight, innerWidth * 1.5) * dpr);
  }

  function frame(now) {
    const s = now / 1000;
    // No holds: progress swings HELLO -> GOODBYE -> HELLO as one continuous wave.
    const p = 0.5 - 0.5 * Math.cos(2 * Math.PI * s / CYCLE);

    // Endless approach: the word keeps coming closer; as it reaches its largest it dissolves
    // while the next run is already growing out of the centre, so there is no cut.
    const total = TOTAL, z = s % total, ratio = fsEnd / fsStart;
    let fsB = 0, wB = 0;
    if (!calm && z > total - OVERLAP) {
      const x = (z - (total - OVERLAP)) / OVERLAP;
      wB = x * x * (3 - 2 * x);
      fsB = fsStart * Math.pow(ratio, (z - total) / total);
    }
    gl.uniform2f(uFs, calm ? fsStart : fsStart * Math.pow(ratio, z / total), fsB);
    gl.uniform2f(uW, 1 - wB, wB);

    gl.uniform1f(uT, s);
    gl.uniform1f(uE, p);                                         // the shader eases it per region
    gl.uniform1f(uG, REST + (1 - REST) * Math.sin(Math.PI * p)); // flow strength; never drops to zero

    // Lightning in the last cycles, struck by the kicks and accented snares of the break.
    let flash = 0, seed = 0;
    const stormStart = total - STORM_CYCLES * CYCLE;
    if (!calm && z > stormStart) {
      const n = Math.floor(s / STEP);
      for (let j = 0; j < 8; j++) {
        const bar = barOf(n - j), i = (((n - j) % 16) + 16) % 16;
        const w = bar.s[i] === 'X' ? 1 : bar.k[i] === 'x' ? 0.55 : 0;
        if (!w) continue;
        const dt = s - (n - j) * STEP;                 // a strike, then a weaker second flicker
        flash = w * (Math.exp(-dt * 9) + (dt > 0.07 ? 0.6 * Math.exp(-(dt - 0.07) * 14) : 0));
        seed = ((n - j) % 97) * 1.37;
        break;
      }
      flash *= Math.min(1, (z - stormStart) / 1.5);
    }
    gl.uniform1f(uFlash, flash);
    gl.uniform1f(uSeed, seed);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }

  // ---- sound: a synthesised old-school break on the same clock as the picture ----
  const hint = document.getElementById('hint');
  let ac = null, drive, tone, master, noiseBuf, nextStep = 0;

  function initAudio() {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

    // drums -> drive -> distortion -> tone -> volume -> limiter -> out
    drive = ac.createGain();
    const shaper = ac.createWaveShaper();
    const curve = new Float32Array(2048);
    for (let i = 0; i < curve.length; i++) {
      const x = (i / (curve.length - 1)) * 2 - 1;
      curve[i] = Math.tanh(4 * x) / Math.tanh(4);
    }
    shaper.curve = curve; shaper.oversample = '4x';
    tone = ac.createBiquadFilter(); tone.type = 'lowpass';
    master = ac.createGain(); master.gain.value = 0;
    const limiter = ac.createDynamicsCompressor();
    limiter.threshold.value = -8; limiter.knee.value = 6; limiter.ratio.value = 14;
    limiter.attack.value = 0.002; limiter.release.value = 0.12;
    drive.connect(shaper).connect(tone).connect(master).connect(limiter).connect(ac.destination);

    ac.onstatechange = showHint;
    setInterval(schedule, 25);
  }

  function burst(t, dur, level, filterType, freq, q) {     // a filtered noise hit
    const src = ac.createBufferSource(); src.buffer = noiseBuf;
    const f = ac.createBiquadFilter(); f.type = filterType; f.frequency.value = freq; f.Q.value = q || 0.7;
    const g = ac.createGain();
    g.gain.setValueAtTime(level, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f).connect(g).connect(drive);
    src.start(t, Math.random() * 0.5, dur + 0.02);
  }
  function thump(t, dur, level, type, f0, f1, sweep) {     // a pitched hit with a falling tone
    const osc = ac.createOscillator(); osc.type = type;
    osc.frequency.setValueAtTime(f0, t); osc.frequency.exponentialRampToValueAtTime(f1, t + sweep);
    const g = ac.createGain();
    g.gain.setValueAtTime(level, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g).connect(drive);
    osc.start(t); osc.stop(t + dur + 0.02);
  }
  function play(n, t) {
    const bar = barOf(n), i = n % 16;
    if (bar.k[i] === 'x') { thump(t, 0.22, 1.0, 'sine', 165, 48, 0.09); burst(t, 0.015, 0.3, 'highpass', 2500); }
    const sn = bar.s[i];
    if (sn === 'X' || sn === 'o') {
      const v = sn === 'X' ? 1 : 0.38;
      burst(t, 0.15, 0.8 * v, 'bandpass', 1900, 0.6);
      burst(t, 0.09, 0.35 * v, 'highpass', 5000);
      thump(t, 0.09, 0.45 * v, 'triangle', 235, 170, 0.05);
    }
    if (i % 2 === 0) burst(t, i % 4 === 0 ? 0.07 : 0.045, i % 4 === 0 ? 0.22 : 0.14, 'highpass', 7500);   // ride
    if (bar.crash === i || n % (TOTAL / STEP) === 0) burst(t, 0.7, 0.3, 'highpass', 4200);
  }
  function schedule() {
    if (ac.state !== 'running') return;
    const nowV = performance.now() / 1000, at = ac.currentTime;
    // Louder and dirtier as the word comes closer.
    const u = (nowV % TOTAL) / TOTAL;
    drive.gain.setTargetAtTime(0.22 + 5.5 * u * u, at, 0.05);
    tone.frequency.setTargetAtTime(5000 + 11000 * u, at, 0.05);
    master.gain.setTargetAtTime(0.14 + 0.62 * u, at, 0.05);

    const first = Math.ceil(nowV / STEP);
    if (nextStep < first) nextStep = first;
    while (nextStep * STEP < nowV + 0.12) { play(nextStep, at + nextStep * STEP - nowV); nextStep++; }
  }
  function showHint() { hint.classList.toggle('off', !!ac && ac.state === 'running'); }
  function toggleSound() {
    if (!ac) initAudio();
    if (ac.state === 'running') ac.suspend(); else ac.resume();
  }
  // Browsers only let sound start after a click or key press, unless the site is allowed to autoplay.
  try { initAudio(); } catch (e) { ac = null; }
  showHint();
  addEventListener('pointerdown', toggleSound);
  addEventListener('keydown', toggleSound);

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
