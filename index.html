<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello, cat</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body.game { cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* Shown only if WebGL2 is unavailable: a plain crossfade on the same 6s loop. */
  .fallback { position: fixed; inset: 0; display: none; }
  .fallback span {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font: 700 clamp(28px, 7vw, 120px) Helvetica, Arial, sans-serif; letter-spacing: 0.05em; text-align: center;
    animation: swap 4s ease-in-out infinite;
  }
  .fallback span + span { animation-delay: -2s; }
  @keyframes swap { 0%, 8% { opacity: 1; } 50%, 58% { opacity: 0; } 100% { opacity: 1; } }
  .hint {
    position: fixed; left: 0; right: 0; bottom: 28px; text-align: center; pointer-events: none;
    color: #9aa844; font: 600 12px Helvetica, Arial, sans-serif; letter-spacing: 0.3em; text-transform: uppercase;
    transition: opacity 0.4s;
  }
  .hint.off { opacity: 0; }
  .stars {
    position: fixed; left: 0; right: 0; top: 24px; text-align: center; pointer-events: none;
    font: 30px/1 Helvetica, Arial, sans-serif; letter-spacing: 0.3em; text-indent: 0.3em; transition: opacity 0.5s;
  }
  .stars.off { opacity: 0; }
  .stars span { color: #451438; transition: color 0.3s, text-shadow 0.3s; }
  .stars span.on { color: #c2d04a; text-shadow: 0 0 14px #b85c30; }
  .count {
    position: fixed; left: 0; right: 0; top: 14px; text-align: center; pointer-events: none;
    color: #c2d04a; font: 700 64px/1 Helvetica, Arial, sans-serif; text-shadow: 0 0 18px #b85c30;
  }
  .count.off { display: none; }
  .count span { display: inline-block; animation: tick 4s ease-out both; }
  @keyframes tick { 0% { transform: scale(2.2); opacity: 0; } 7% { transform: scale(1); opacity: 1; } 100% { transform: scale(0.9); opacity: 0.7; } }

  /* The pointer in the game: a toothed trap that chomps like a mouth. */
  .trap { position: fixed; left: 0; top: 0; width: 72px; height: 72px; margin: -36px 0 0 -36px; pointer-events: none; display: none; }
  body.game .trap.seen { display: block; }
  .trap svg { width: 100%; height: 100%; overflow: visible; }
  .trap path { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linejoin: round; }
  .trap circle { fill: #c2d04a; }
  .trap .acc { opacity: 0; transition: opacity 0.25s; }
  .trap .acc path { stroke-linecap: round; }
  .trap[data-acc="ears"] .ears, .trap[data-acc="whiskers"] .whiskers, .trap[data-acc="tail"] .tail { opacity: 1; }
  .trap .tail { transform-origin: 0 25px; animation: wag 0.5s ease-in-out infinite alternate; }
  @keyframes wag { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
  .trap .up { animation: chomp-up 0.42s ease-in-out infinite alternate; }
  .trap .down { animation: chomp-down 0.42s ease-in-out infinite alternate; }
  @keyframes chomp-up { from { transform: translateY(-12px) rotate(-6deg); } to { transform: translateY(1px); } }
  @keyframes chomp-down { from { transform: translateY(12px) rotate(6deg); } to { transform: translateY(-1px); } }

  /* What the hole says when it gets away: a comic speech bubble. */
  .bubble { position: fixed; left: 0; top: 0; pointer-events: none; }
  .bubble b {
    display: block; white-space: nowrap; padding: 7px 14px 8px; background: #fff; color: #000;
    border: 3px solid #000; border-radius: 18px; box-shadow: 4px 4px 0 #b85c30;
    font: italic 700 19px "Comic Sans MS", "Chalkboard SE", "Marker Felt", cursive;
    transform: scale(0) rotate(-5deg); transform-origin: 10% 110%; transition: transform 0.16s cubic-bezier(.3, 1.7, .5, 1);
  }
  .bubble.show b { transform: scale(1) rotate(-5deg); }
  .no-gl .stars, .no-gl .count, .no-gl .trap, .no-gl .bubble { display: none; }
  .no-gl .hint { display: none; }
  .no-gl canvas { display: none; }
  .no-gl .fallback { display: block; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="Hello, cat growing into catch me if you can! and back"></canvas>
<div class="count off" id="count" aria-hidden="true"></div>
<div class="bubble" id="bubble" aria-live="polite"><b></b></div>
<div class="trap" id="trap" aria-hidden="true"><svg viewBox="-30 -30 60 60">
  <g class="acc tail"><path d="M0,25 C2,36 16,34 15,45 S24,56 20,62"/></g>
  <g class="acc whiskers"><path d="M-24,0 L-40,-7 M-24,1 L-41,1 M-24,2 L-40,9 M24,0 L40,-7 M24,1 L41,1 M24,2 L40,9"/></g>
  <g class="up"><path d="M-22,-3 A22,22 0 0 1 22,-3 L17.6,-3 l-4.4,8 -4.4,-8 -4.4,8 -4.4,-8 -4.4,8 -4.4,-8 -4.4,8 -4.4,-8 Z"/>
    <g class="acc ears"><path d="M-19,-14 L-22,-33 L-7,-24 Z M19,-14 L22,-33 L7,-24 Z"/></g></g>
  <g class="down"><path d="M-22,3 A22,22 0 0 0 22,3 L13.2,3 l-4.4,-8 -4.4,8 -4.4,-8 -4.4,8 -4.4,-8 -4.4,8 Z"/></g>
  <circle cx="-22" cy="0" r="2.6"/><circle cx="22" cy="0" r="2.6"/>
</svg></div>
<div class="stars off" id="stars" aria-label="Stars caught"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>
<div class="hint off" id="hint">click for sound</div>
<div class="fallback" aria-hidden="true"><span>Hello, cat</span><span>catch me if you can!</span></div>
<script>
(() => {
  const WORDS = [['Hello, cat'], ['catch me', 'if you can!'], ['YOU WON!'], ['cats', 'thank you']];   // each a list of lines
  const CYCLE = 4;             // seconds: first phrase -> second -> first
  const REST = 0.28;           // how much it keeps flowing even when a word is fully formed (0 = freezes)
  const ZOOM_CYCLES = 3;       // word cycles it takes to grow from normal size to its largest
  const OVERLAP = 1.5;         // seconds the outgoing giant word and the incoming small one share
  const STORM_CYCLES = 2;      // lightning behind the letters during this many final cycles
  const TOTAL = CYCLE * ZOOM_CYCLES;

  // The break: 160 BPM, sixteen steps to a bar, four bars (A A B C) looping. Three cycles = eight bars.
  // x = hit, X = accented snare, o = ghost snare.
  const STEP = 60 / 160 / 4;
  const BARS = [
    { k: 'x.x.......xx....', s: '....X..o.o..X..o' },
    { k: 'x.x.......xx....', s: '....X..o.o..X..o' },
    { k: 'x.x.......x.....', s: '....X..o.o....X.' },
    { k: '..xx......x.....', s: '.o..X..o.o....X.', crash: 10 },
  ];
  const barOf = (n) => BARS[Math.floor(n / 16) % BARS.length];

  // Distance-field texture: both words drawn once, at a fixed size, independent of the screen.
  const TW = 2048, TH = 1024;

  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
  if (!gl) { document.documentElement.classList.add('no-gl'); return; }
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- signed distance fields (exact Euclidean distance transform) ----
  const INF = 1e20;
  function edt1d(f, d, v, z, n) {
    v[0] = 0; z[0] = -INF; z[1] = INF;
    for (let q = 1, k = 0; q < n; q++) {
      let s;
      do {
        const r = v[k];
        s = (f[q] - f[r] + q * q - r * r) / (q - r) / 2;
      } while (s <= z[k] && --k > -1);
      k++; v[k] = q; z[k] = s; z[k + 1] = INF;
    }
    for (let q = 0, k = 0; q < n; q++) {
      while (z[k + 1] < q) k++;
      const r = v[k];
      d[q] = f[r] + (q - r) * (q - r);
    }
  }
  function edt(grid, w, h) {
    const n = Math.max(w, h);
    const f = new Float64Array(n), d = new Float64Array(n);
    const v = new Uint16Array(n), z = new Float64Array(n + 1);
    for (let x = 0; x < w; x++) {
      for (let y = 0; y < h; y++) f[y] = grid[y * w + x];
      edt1d(f, d, v, z, h);
      for (let y = 0; y < h; y++) grid[y * w + x] = d[y];
    }
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) f[x] = grid[y * w + x];
      edt1d(f, d, v, z, w);
      for (let x = 0; x < w; x++) grid[y * w + x] = Math.sqrt(d[x]);
    }
  }

  const scratch = document.createElement('canvas');
  scratch.width = TW; scratch.height = TH;
  const sx = scratch.getContext('2d', { willReadFrequently: true });
  const fontOf = (px) => `700 ${px}px Helvetica, Arial, sans-serif`;
  const spaced = (px) => { if ('letterSpacing' in sx) sx.letterSpacing = `${px * 0.05}px`; };

  // Pick the texture font size so the widest line and the tallest phrase both fit with room to spare.
  sx.font = fontOf(100); spaced(100);
  const widthEm = (line) => sx.measureText(line).width / 100;
  const EM = Math.floor(Math.min(
    TW * 0.62 / Math.max(...WORDS.flat().map(widthEm)),
    TH * 0.5 / Math.max(...WORDS.map((lines) => lines.length))));
  // Where the cat's tail grows from: the foot of the last letter of the first phrase (em units from centre).
  const TAIL = [widthEm(WORDS[0][0]) / 2 + 0.02, 0.2];

  const field = new Float32Array(TW * TH * 4);   // R, G, B, A = the four phrases, distances in em units
  WORDS.forEach((lines, ch) => {
    sx.clearRect(0, 0, TW, TH);
    sx.font = fontOf(EM); spaced(EM);
    sx.textAlign = 'center'; sx.textBaseline = 'middle'; sx.fillStyle = '#fff';
    lines.forEach((line, i) => sx.fillText(line, TW / 2, TH / 2 + (i - (lines.length - 1) / 2) * EM));
    const px = sx.getImageData(0, 0, TW, TH).data;
    const outer = new Float64Array(TW * TH), inner = new Float64Array(TW * TH);
    for (let i = 0; i < TW * TH; i++) {
      const a = px[i * 4 + 3] / 255;
      outer[i] = a === 1 ? 0 : a === 0 ? INF : Math.max(0, 0.5 - a) ** 2;
      inner[i] = a === 1 ? INF : a === 0 ? 0 : Math.max(0, a - 0.5) ** 2;
    }
    edt(outer, TW, TH); edt(inner, TW, TH);
    for (let i = 0; i < TW * TH; i++) field[i * 4 + ch] = (outer[i] - inner[i]) / EM;
  });

  // ---- GL ----
  const VERT = `#version 300 es
  in vec2 a; void main() { gl_Position = vec4(a, 0.0, 1.0); }`;

  const FRAG = `#version 300 es
  precision highp float;
  uniform sampler2D uField;
  uniform vec2 uRes, uTex;   // canvas size (px); texture size / em size
  uniform vec2 uFs, uW;       // font size (px) and weight of the two overlapping zoom layers
  uniform vec3 uHole;         // the hole: centre (px) and radius (px, 0 = none)
  uniform vec2 uTail;         // where the tail is attached (em)
  uniform vec4 uGhost[3];     // cat ghosts in the background: centre (px), size (px), strength
  uniform float uT, uE, uG, uCalm, uFlash, uSeed, uSuck, uWin;
  out vec4 o;

  float hash(vec2 p) {
    vec3 q = fract(vec3(p.xyx) * 0.1031);
    q += dot(q, q.yzx + 33.33);
    return fract((q.x + q.y) * q.z);
  }
  float noise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
    return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x),
               mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
  }
  // Two soft octaves only: liquid, no crinkle.
  float soft(vec2 p) { return (noise(p) + 0.45 * noise(p * 1.9 + 31.7)) / 1.45; }
  vec2 flow(vec2 p, float t) {
    return vec2(soft(p + vec2(0.0, t)), soft(p + vec2(5.2, -t) + 1.7)) - 0.5;
  }
  // Colours lifted from the reference image: indigo, plum, brick, rust, olive-yellow, moss, teal.
  const vec3 PAL[7] = vec3[7](
    vec3(0.20, 0.125, 0.42), vec3(0.42, 0.12, 0.33), vec3(0.59, 0.19, 0.165), vec3(0.72, 0.36, 0.19),
    vec3(0.60, 0.66, 0.27), vec3(0.185, 0.36, 0.23), vec3(0.14, 0.28, 0.30));
  vec3 palette(float h) {
    h = fract(h) * 7.0;
    int i = int(floor(h));
    return mix(PAL[i], PAL[(i + 1) % 7], smoothstep(0.0, 1.0, fract(h)));
  }

  // One lightning bolt: a thin jagged line across the screen at a random angle, plus a faint halo.
  float bolt(vec2 sp, float seed) {
    float a = hash(vec2(seed, 1.3)) * 3.1416;
    vec2 r = vec2(cos(a) * sp.x + sin(a) * sp.y, cos(a) * sp.y - sin(a) * sp.x);
    float path = (hash(vec2(seed, 7.7)) - 0.5) * 0.9
               + (noise(vec2(r.y * 3.0, seed)) - 0.5) * 0.30
               + (noise(vec2(r.y * 13.0, seed + 9.0)) - 0.5) * 0.05;
    float dd = abs(r.x - path);
    return 0.0034 / (dd + 0.0034) + 0.05 * exp(-dd * 12.0);
  }

  // The cat's tail: long enough to cross the page. It leaves the last letter sideways, rises,
  // and sways slowly from the base while the bend travels up to the tip, which flicks on its own.
  float tail(vec2 q) {
    const int N = 14;
    float w = uT * 3.14159;                          // one full sway every two seconds
    float ang = -0.35 + 0.22 * sin(w), d = 1e3;
    vec2 a = uTail;
    for (int i = 0; i < N; i++) {
      float f = float(i) / float(N - 1);
      ang += -0.32 * exp(-4.0 * f)                   // the rise
           + 0.13 * sin(w - 0.5 - f * 3.2)           // the sway, arriving later further along
           + 0.10 * f * f * sin(2.0 * w - f * 5.0);  // the tip
      vec2 b = a + 0.3 * vec2(cos(ang), sin(ang));
      vec2 pa = q - a, ba = b - a;
      float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0);
      d = min(d, length(pa - ba * h) - mix(0.15, 0.10, (float(i) + h) / float(N)));
      a = b;
    }
    return d;
  }
  float smin(float a, float b, float k) {
    float h = max(k - abs(a - b), 0.0) / k;
    return min(a, b) - h * h * k * 0.25;
  }

  // A cat's ghost: round head, two ears, a body ending in a wavy hem, hollow eyes. Units of its size, y up.
  float ghost(vec2 g, float t) {
    g.x += 0.06 * sin(g.y * 5.0 + t * 2.0);
    float head = length(g - vec2(0.0, 0.3)) - 0.42;
    vec2 e = vec2(abs(abs(g.x) - 0.28), g.y - 0.6);
    float ear = max(max((e.x - 0.19 * (0.4 - e.y) / 0.43) * 0.9, -e.y - 0.05), e.y - 0.4);
    float hem = -0.78 + 0.07 * sin(g.x * 16.0 + t * 3.0);
    float body = max(abs(g.x) - 0.42, max(g.y - 0.3, hem - g.y));
    float eyes = length(vec2(abs(g.x) - 0.16, g.y - 0.34)) - 0.065;
    return max(min(min(head, ear), body), -eyes);
  }

  vec4 shade(float fs) {
    // Going down the hole: everything spirals around it, tighter and smaller, until it is a point.
    vec2 v = gl_FragCoord.xy - mix(0.5 * uRes, uHole.xy, uSuck);
    if (uSuck > 0.0) {
      float a = uSuck * uSuck * 7.0 / (0.3 + 2.0 * length(v) / uRes.y);
      v = vec2(cos(a) * v.x - sin(a) * v.y, sin(a) * v.x + cos(a) * v.y);
      fs *= max(pow(1.0 - uSuck, 2.5), 1e-3);
    }
    vec2 p = v / fs;                                 // em units, origin at centre
    p.y = -p.y;

    // The surface breathes and flows: a swirl folded into itself, strongest mid-change.
    float amp = (0.006 + 0.20 * uG) * (1.0 - uCalm);
    vec2 w1 = flow(p * 0.9, uT * 0.14);
    vec2 w2 = flow(p * 1.6 + w1 * 2.5, uT * 0.19);
    vec2 q = p * (1.0 - 0.03 * uG * sin(uT * 1.3) * (1.0 - uCalm)) + (w1 + w2 * 0.6) * amp;

    vec2 uv = 0.5 + q / uTex;
    vec4 d3 = texture(uField, uv);
    d3.x = smin(d3.x, tail(q), 0.1);                 // the first phrase wears the tail

    // Each region ripens at its own moment, so one word grows out of the other in patches.
    float n = soft(p * 1.1 + w1 * 1.5 + uT * 0.05);
    float k = 0.55 * (1.0 - uCalm);
    float m = smoothstep(n * k, n * k + 1.0, uE * (1.0 + k));

    float d = mix(mix(d3.x, d3.y, m), d3.z, min(uWin, 1.0));                        // YOU WON!
    d = mix(d, d3.w, smoothstep(n * k, n * k + 1.0, max(uWin - 1.0, 0.0) * (1.0 + k)));   // then: cats thank you
    d -= uG * 0.05;                                              // keep its body while in between
    d += uG * 0.10 * (soft(q * 2.2 + uT * 0.3) - 0.5) * (1.0 - uCalm);   // buds and hollows

    // Fur: fine strands combed along a slowly turning direction. They roughen the outline
    // and shade the body; broad ginger stripes run across them, like a tabby.
    float ds = d, aa = max(fwidth(d), 1e-4);
    float th = 1.25 + 1.6 * (soft(q * 0.7 + 3.0) - 0.5);
    vec2 fq = vec2(cos(th) * q.x + sin(th) * q.y, cos(th) * q.y - sin(th) * q.x);
    float strand = 0.65 * noise(vec2(fq.x * 5.0, fq.y * 70.0)) + 0.35 * noise(vec2(fq.x * 9.0 + 4.0, fq.y * 150.0));
    d += (strand - 0.5) * 0.045;
    float body = smoothstep(aa, -aa, d);
    float stripe = smoothstep(0.42, 0.7, soft(vec2(fq.x * 1.3, fq.y * 4.0) + 7.0));
    vec3 fur = mix(vec3(1.0, 0.97, 0.92), vec3(0.86, 0.52, 0.27), 0.5 * stripe) * (0.58 + 0.42 * strand);

    // Aura: a faint, close ring in the palette's colours, brightest mid-change.
    vec2 e = smoothstep(vec2(0.0), vec2(0.08), uv) * smoothstep(vec2(0.0), vec2(0.08), 1.0 - uv);
    float ring = 0.5 + 0.5 * sin(ds * 20.0 - uT * 3.0 + n * 5.0);
    float glow = exp(-max(ds, 0.0) * 7.0) * uG * e.x * e.y * (1.0 - uCalm);
    vec3 aura = palette(ds * 0.9 - uT * 0.13 + n * 0.7) * ring * glow * 0.5;

    return vec4(mix(aura, fur, body), body);
  }

  void main() {
    vec4 c = vec4(0.0);
    if (uW.x > 0.0) c += shade(uFs.x) * uW.x;
    if (uW.y > 0.0) c += shade(uFs.y) * uW.y;   // the next run, already emerging in the distance

    // Lightning behind the letters: bolts and a dull glow in the cloud, hidden where a letter covers them.
    vec3 bg = vec3(0.0);
    if (uFlash > 0.0) {
      vec2 sp = (gl_FragCoord.xy - 0.5 * uRes) / uRes.y;
      float b = bolt(sp, uSeed) + 0.7 * bolt(sp, uSeed + 3.1) + 0.45 * bolt(sp, uSeed + 6.2);
      float cloud = soft(sp * 1.6 + uSeed);
      bg = (vec3(0.80, 0.86, 0.36) * min(b, 1.4) + vec3(0.62, 0.20, 0.13) * cloud * cloud * 1.2
            + vec3(0.42, 0.12, 0.33) * 0.12) * uFlash;
    }
    for (int i = 0; i < 3; i++) {
      if (uGhost[i].w <= 0.0) continue;
      float gd = ghost((gl_FragCoord.xy - uGhost[i].xy) / uGhost[i].z, uT + float(i) * 2.0);
      bg += vec3(0.62, 0.80, 0.72) * (smoothstep(0.04, -0.04, gd) * 0.2 + exp(-max(gd, 0.0) * 7.0) * 0.1) * uGhost[i].w;
    }
    vec3 col = c.rgb + bg * (1.0 - clamp(c.a, 0.0, 1.0));

    // The hole the word went down: a small white disc with a spiral halo.
    if (uHole.z > 0.0) {
      vec2 hv = gl_FragCoord.xy - uHole.xy;
      float hd = length(hv) / uHole.z;                           // distance in radii
      float arm = 0.5 + 0.5 * sin(hd * 2.2 - uT * 7.0 + atan(hv.y, hv.x) * 2.0);
      vec3 halo = palette(hd * 0.12 - uT * 0.2) * arm * exp(-max(hd - 1.0, 0.0) * 0.55) * 1.5;
      float e = 1.5 / uHole.z;
      col = mix(col + halo, vec3(1.0), smoothstep(1.0 + e, 1.0 - e, hd));
    }
    o = vec4(col, 1.0);
  }`;

  function shader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, TW, TH, 0, gl.RGBA, gl.FLOAT, field);

    if (phase === WIN && clock() > tWin + 5.5) restart();
  });
  addEventListener('keydown', (e) => {
    if (e.key === 'm' || e.key === 'M') { if (live()) ac.suspend(); else soundOn(); }   // M mutes
    else soundOn();
  });

  addEventListener('resize', resize);
  resize();
  showStars();
  setPhase(INTRO);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
