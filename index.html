<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HELLO / GOODBYE</title>
<style>
  html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* Shown only if WebGL2 is unavailable: a plain crossfade on the same 6s loop. */
  .fallback { position: fixed; inset: 0; display: none; }
  .fallback span {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #fff; font: 700 clamp(48px, 12vw, 200px) Helvetica, Arial, sans-serif; letter-spacing: 0.05em;
    animation: swap 6s ease-in-out infinite;
  }
  .fallback span + span { animation-delay: -3s; }
  @keyframes swap { 0%, 8% { opacity: 1; } 50%, 58% { opacity: 0; } 100% { opacity: 1; } }
  .no-gl canvas { display: none; }
  .no-gl .fallback { display: block; }
</style>
</head>
<body>
<canvas id="c" role="img" aria-label="HELLO growing into GOODBYE and back"></canvas>
<div class="fallback" aria-hidden="true"><span>HELLO</span><span>GOODBYE</span></div>
<script>
(() => {
  const WORDS = ['HELLO', 'GOODBYE'];
  const CYCLE = 6;             // seconds: HELLO -> GOODBYE -> HELLO
  const REST = 0.28;           // how much it keeps flowing even when a word is fully formed (0 = freezes)
  const ZOOM_CYCLES = 4;       // word cycles it takes to grow from normal size to its largest
  const OVERLAP = 3;           // seconds the outgoing giant word and the incoming small one share

  // Distance-field texture: both words drawn once, at a fixed size, independent of the screen.
  const TW = 3072, TH = 960;

  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
  if (!gl) { document.documentElement.classList.add('no-gl'); return; }
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- signed distance fields (exact Euclidean distance transform) ----
  const INF = 1e20;
  function edt1d(f, d, v, z, n) {
    v[0] = 0; z[0] = -INF; z[1] = INF;
    for (let q = 1, k = 0; q < n; q++) {
      let s;
      do {
        const r = v[k];
        s = (f[q] - f[r] + q * q - r * r) / (q - r) / 2;
      } while (s <= z[k] && --k > -1);
      k++; v[k] = q; z[k] = s; z[k + 1] = INF;
    }
    for (let q = 0, k = 0; q < n; q++) {
      while (z[k + 1] < q) k++;
      const r = v[k];
      d[q] = f[r] + (q - r) * (q - r);
    }
  }
  function edt(grid, w, h) {
    const n = Math.max(w, h);
    const f = new Float64Array(n), d = new Float64Array(n);
    const v = new Uint16Array(n), z = new Float64Array(n + 1);
    for (let x = 0; x < w; x++) {
      for (let y = 0; y < h; y++) f[y] = grid[y * w + x];
      edt1d(f, d, v, z, h);
      for (let y = 0; y < h; y++) grid[y * w + x] = d[y];
    }
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) f[x] = grid[y * w + x];
      edt1d(f, d, v, z, w);
      for (let x = 0; x < w; x++) grid[y * w + x] = Math.sqrt(d[x]);
    }
  }

  const scratch = document.createElement('canvas');
  scratch.width = TW; scratch.height = TH;
  const sx = scratch.getContext('2d', { willReadFrequently: true });
  const fontOf = (px) => `700 ${px}px Helvetica, Arial, sans-serif`;
  const spaced = (px) => { if ('letterSpacing' in sx) sx.letterSpacing = `${px * 0.05}px`; };

  // Pick the texture font size so the longer word fills ~70% of the texture width.
  sx.font = fontOf(100); spaced(100);
  const EM = Math.floor(100 * (TW * 0.7) / Math.max(...WORDS.map((w) => sx.measureText(w).width)));

  const field = new Float32Array(TW * TH * 2);   // R = HELLO, G = GOODBYE, in em units
  WORDS.forEach((word, ch) => {
    sx.clearRect(0, 0, TW, TH);
    sx.font = fontOf(EM); spaced(EM);
    sx.textAlign = 'center'; sx.textBaseline = 'middle'; sx.fillStyle = '#fff';
    sx.fillText(word, TW / 2, TH / 2);
    const px = sx.getImageData(0, 0, TW, TH).data;
    const outer = new Float64Array(TW * TH), inner = new Float64Array(TW * TH);
    for (let i = 0; i < TW * TH; i++) {
      const a = px[i * 4 + 3] / 255;
      outer[i] = a === 1 ? 0 : a === 0 ? INF : Math.max(0, 0.5 - a) ** 2;
      inner[i] = a === 1 ? INF : a === 0 ? 0 : Math.max(0, a - 0.5) ** 2;
    }
    edt(outer, TW, TH); edt(inner, TW, TH);
    for (let i = 0; i < TW * TH; i++) field[i * 2 + ch] = (outer[i] - inner[i]) / EM;
  });

  // ---- GL ----
  const VERT = `#version 300 es
  in vec2 a; void main() { gl_Position = vec4(a, 0.0, 1.0); }`;

  const FRAG = `#version 300 es
  precision highp float;
  uniform sampler2D uField;
  uniform vec2 uRes, uTex;   // canvas size (px); texture size / em size
  uniform vec2 uFs, uW;       // font size (px) and weight of the two overlapping zoom layers
  uniform float uT, uE, uG, uCalm;
  out vec4 o;

  float hash(vec2 p) {
    vec3 q = fract(vec3(p.xyx) * 0.1031);
    q += dot(q, q.yzx + 33.33);
    return fract((q.x + q.y) * q.z);
  }
  float noise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
    return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x),
               mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
  }
  // Two soft octaves only: liquid, no crinkle.
  float soft(vec2 p) { return (noise(p) + 0.45 * noise(p * 1.9 + 31.7)) / 1.45; }
  vec2 flow(vec2 p, float t) {
    return vec2(soft(p + vec2(0.0, t)), soft(p + vec2(5.2, -t) + 1.7)) - 0.5;
  }
  vec3 spectrum(float h) { return 0.5 + 0.5 * cos(6.2832 * (h + vec3(0.0, 0.33, 0.67))); }

  vec3 shade(float fs) {
    vec2 p = (gl_FragCoord.xy - 0.5 * uRes) / fs;    // em units, origin at centre
    p.y = -p.y;

    // The surface breathes and flows: a swirl folded into itself, strongest mid-change.
    float amp = (0.006 + 0.20 * uG) * (1.0 - uCalm);
    vec2 w1 = flow(p * 0.9, uT * 0.14);
    vec2 w2 = flow(p * 1.6 + w1 * 2.5, uT * 0.19);
    vec2 q = p * (1.0 - 0.03 * uG * sin(uT * 1.3) * (1.0 - uCalm)) + (w1 + w2 * 0.6) * amp;

    vec2 uv = 0.5 + q / uTex;
    vec2 d2 = texture(uField, uv).rg;

    // Each region ripens at its own moment, so one word grows out of the other in patches.
    float n = soft(p * 1.1 + w1 * 1.5 + uT * 0.05);
    float k = 0.55 * (1.0 - uCalm);
    float m = smoothstep(n * k, n * k + 1.0, uE * (1.0 + k));

    float d = mix(d2.x, d2.y, m);
    d -= uG * 0.05;                                              // keep its body while in between
    d += uG * 0.10 * (soft(q * 2.2 + uT * 0.3) - 0.5) * (1.0 - uCalm);   // buds and hollows

    float aa = max(fwidth(d), 1e-4);
    float body = smoothstep(aa, -aa, d);

    // Aura: soft spectral rings drifting off the shape, brightest mid-change.
    vec2 e = smoothstep(vec2(0.0), vec2(0.08), uv) * smoothstep(vec2(0.0), vec2(0.08), 1.0 - uv);
    float ring = 0.5 + 0.5 * sin(d * 20.0 - uT * 3.0 + n * 5.0);
    float glow = exp(-max(d, 0.0) * 3.6) * uG * e.x * e.y * (1.0 - uCalm);
    vec3 aura = spectrum(d * 1.3 - uT * 0.2 + n * 0.9) * ring * glow * 0.85;

    return mix(aura, vec3(1.0), body);
  }

  void main() {
    vec3 c = shade(uFs.x) * uW.x;
    if (uW.y > 0.0) c += shade(uFs.y) * uW.y;   // the next run, already emerging in the distance
    o = vec4(c, 1.0);
  }`;

  function shader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG16F, TW, TH, 0, gl.RG, gl.FLOAT, field);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  const U = (name) => gl.getUniformLocation(prog, name);
  const uRes = U('uRes'), uTex = U('uTex'), uFs = U('uFs'), uT = U('uT'), uE = U('uE'), uG = U('uG'), uW = U('uW');
  gl.uniform1i(U('uField'), 0);
  gl.uniform1f(U('uCalm'), calm ? 1 : 0);
  gl.uniform2f(uTex, TW / EM, TH / EM);

  let fsStart = 0, fsEnd = 0;   // font size in device px: where the zoom begins and where it ends
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.uniform2f(uRes, canvas.width, canvas.height);
    fsStart = Math.max(48, Math.min(innerWidth * 0.12, 200)) * dpr;
    // Largest: letters about half the screen tall, the word spilling past both sides.
    fsEnd = Math.max(fsStart * 2.2, 0.7 * Math.min(innerHeight, innerWidth * 1.5) * dpr);
  }

  function frame(now) {
    const s = now / 1000;
    // No holds: progress swings HELLO -> GOODBYE -> HELLO as one continuous wave.
    const p = 0.5 - 0.5 * Math.cos(2 * Math.PI * s / CYCLE);

    // Endless approach: the word keeps coming closer; as it reaches its largest it dissolves
    // while the next run is already growing out of the centre, so there is no cut.
    const total = CYCLE * ZOOM_CYCLES, z = s % total, ratio = fsEnd / fsStart;
    let fsB = 0, wB = 0;
    if (!calm && z > total - OVERLAP) {
      const x = (z - (total - OVERLAP)) / OVERLAP;
      wB = x * x * (3 - 2 * x);
      fsB = fsStart * Math.pow(ratio, (z - total) / total);
    }
    gl.uniform2f(uFs, calm ? fsStart : fsStart * Math.pow(ratio, z / total), fsB);
    gl.uniform2f(uW, 1 - wB, wB);

    gl.uniform1f(uT, s);
    gl.uniform1f(uE, p);                                         // the shader eases it per region
    gl.uniform1f(uG, REST + (1 - REST) * Math.sin(Math.PI * p)); // flow strength; never drops to zero
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
